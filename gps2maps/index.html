<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS to Map Converter</title>
    <style>
        :root {
            /* Dark Theme (Default) */
            --bg-color: #0b132b;
            --container-bg: rgba(28, 37, 65, 0.6);
            --card-bg: rgba(58, 80, 107, 0.4);
            --text-main: #ffffff;
            --text-muted: #a0aec0;
            --accent: #48cae4;
            --accent-hover: #00b4d8;
            --success: #2ecc71;
            --error: #e74c3c;
            --border: rgba(255, 255, 255, 0.1);
        }

        [data-theme="light"] {
            /* Light Theme */
            --bg-color: #f0f4f8;
            --container-bg: rgba(255, 255, 255, 0.8);
            --card-bg: rgba(226, 232, 240, 0.6);
            --text-main: #1a202c;
            --text-muted: #4a5568;
            --accent: #0077b6;
            --accent-hover: #023e8a;
            --border: rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background-color 0.3s ease;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            background: var(--container-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 5px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .icon-btn:hover {
            opacity: 1;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            cursor: pointer;
            text-align: center;
            font-weight: 500;
            transition: all 0.2s;
        }

        .tab.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        textarea, input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 15px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            margin-bottom: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        textarea:focus, input:focus, select:focus {
            border-color: var(--accent);
        }

        .manual-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--text-main);
        }

        .btn-outline:hover {
            background: var(--card-bg);
        }

        /* Settings Panel */
        #settings-panel {
            display: none;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        /* Result Card */
        #result-card {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: rgba(46, 204, 113, 0.1);
            border: 1px solid var(--success);
            border-radius: 8px;
            text-align: center;
            animation: slideUp 0.4s ease;
        }

        .coord-display {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin: 10px 0;
        }

        .source-badge {
            display: inline-block;
            font-size: 0.75rem;
            padding: 3px 8px;
            background: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 15px;
            color: var(--text-muted);
        }

        .result-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        #error-msg {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background: rgba(231, 76, 60, 0.1);
            border-left: 4px solid var(--error);
            color: var(--error);
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .loader {
            display: none;
            text-align: center;
            margin: 15px 0;
            color: var(--accent);
            font-size: 0.9rem;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 480px) {
            .manual-grid { grid-template-columns: 1fr; }
            .result-actions { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>📍 GPS Converter</h1>
        <div>
            <button class="icon-btn" id="btn-settings" title="Settings">⚙️</button>
            <button class="icon-btn" id="btn-theme" title="Toggle Theme">🌓</button>
        </div>
    </header>

    <!-- Settings Panel (Groq AI Integration) -->
    <div id="settings-panel">
        <h3 style="margin-bottom: 15px; font-size: 1.1rem;">Groq AI Settings</h3>
        <div class="toggle-container">
            <input type="checkbox" id="use-groq">
            <label for="use-groq">Use Groq AI for smart coordinate extraction</label>
        </div>
        <div id="groq-inputs" style="display: none;">
            <input type="text" id="groq-api-key" placeholder="Enter Groq API Key (sk-...)">
            <select id="groq-model">
                <option value="llama3-8b-8192">Llama 3 8B (Default)</option>
                <option value="llama3-70b-8192">Llama 3 70B</option>
                <option value="mixtral-8x7b-32768">Mixtral 8x7B</option>
            </select>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 10px;">
                Key is stored locally in your browser. AI is used as a fallback or enhancement for messy text.
            </p>
        </div>
        <button class="btn btn-outline" id="btn-save-settings">Save & Close</button>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <div class="tab active" data-target="tab-paste">Paste Text</div>
        <div class="tab" data-target="tab-manual">Manual Entry</div>
    </div>

    <!-- Paste Text Tab -->
    <div class="tab-content active" id="tab-paste">
        <textarea id="gps-input" placeholder="Paste your GPS coordinates here...
Example: 
GPS Latitude : 44 deg 54' 42.19&quot; N
GPS Longitude : 93 deg 10' 0.70&quot; W"></textarea>
        <button class="btn" id="btn-convert-paste">Extract & Convert</button>
    </div>

    <!-- Manual Entry Tab -->
    <div class="tab-content" id="tab-manual">
        <div class="manual-grid">
            <div>
                <label style="font-size: 0.85rem; color: var(--text-muted);">Latitude (Decimal)</label>
                <input type="number" id="lat-manual" step="any" placeholder="e.g. 44.911719">
            </div>
            <div>
                <label style="font-size: 0.85rem; color: var(--text-muted);">Longitude (Decimal)</label>
                <input type="number" id="lng-manual" step="any" placeholder="e.g. -93.166861">
            </div>
        </div>
        <button class="btn" id="btn-convert-manual">Generate Map Link</button>
    </div>

    <!-- Loading State -->
    <div class="loader" id="loader">Processing coordinates...</div>

    <!-- Error Message -->
    <div id="error-msg"></div>

    <!-- Result Card -->
    <div id="result-card">
        <div class="source-badge" id="result-source">Source: Standard Parser</div>
        <div style="color: var(--text-muted); font-size: 0.9rem;">Decimal Coordinates:</div>
        <div class="coord-display" id="coord-display">0.000000, 0.000000</div>
        
        <div class="result-actions">
            <button class="btn" id="btn-open-maps">🗺️ Open in Google Maps</button>
            <button class="btn btn-outline" id="btn-copy-link">🔗 Copy Link</button>
        </div>
    </div>

</div>

<script>
    /**
     * DOM Elements & State initialization
     */
    const elements = {
        themeBtn: document.getElementById('btn-theme'),
        settingsBtn: document.getElementById('btn-settings'),
        settingsPanel: document.getElementById('settings-panel'),
        useGroqCheck: document.getElementById('use-groq'),
        groqInputs: document.getElementById('groq-inputs'),
        groqApiKey: document.getElementById('groq-api-key'),
        groqModel: document.getElementById('groq-model'),
        saveSettingsBtn: document.getElementById('btn-save-settings'),
        tabs: document.querySelectorAll('.tab'),
        tabContents: document.querySelectorAll('.tab-content'),
        gpsInput: document.getElementById('gps-input'),
        btnConvertPaste: document.getElementById('btn-convert-paste'),
        latManual: document.getElementById('lat-manual'),
        lngManual: document.getElementById('lng-manual'),
        btnConvertManual: document.getElementById('btn-convert-manual'),
        resultCard: document.getElementById('result-card'),
        coordDisplay: document.getElementById('coord-display'),
        resultSource: document.getElementById('result-source'),
        btnOpenMaps: document.getElementById('btn-open-maps'),
        btnCopyLink: document.getElementById('btn-copy-link'),
        errorMsg: document.getElementById('error-msg'),
        loader: document.getElementById('loader')
    };

    let currentMapsUrl = "";

    /**
     * Initialization & LocalStorage Management
     */
    function init() {
        // Theme
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);

        // Settings
        elements.useGroqCheck.checked = localStorage.getItem('useGroq') === 'true';
        elements.groqApiKey.value = localStorage.getItem('groqApiKey') || '';
        elements.groqModel.value = localStorage.getItem('groqModel') || 'llama3-8b-8192';
        toggleGroqInputs();
    }

    /**
     * Event Listeners
     */
    elements.themeBtn.addEventListener('click', () => {
        const isLight = document.body.getAttribute('data-theme') === 'light';
        document.body.setAttribute('data-theme', isLight ? 'dark' : 'light');
        localStorage.setItem('theme', isLight ? 'dark' : 'light');
    });

    elements.settingsBtn.addEventListener('click', () => {
        const isHidden = elements.settingsPanel.style.display === 'none' || elements.settingsPanel.style.display === '';
        elements.settingsPanel.style.display = isHidden ? 'block' : 'none';
    });

    elements.useGroqCheck.addEventListener('change', toggleGroqInputs);

    elements.saveSettingsBtn.addEventListener('click', () => {
        localStorage.setItem('useGroq', elements.useGroqCheck.checked);
        localStorage.setItem('groqApiKey', elements.groqApiKey.value.trim());
        localStorage.setItem('groqModel', elements.groqModel.value);
        elements.settingsPanel.style.display = 'none';
    });

    elements.tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            elements.tabs.forEach(t => t.classList.remove('active'));
            elements.tabContents.forEach(c => c.classList.remove('active'));
            
            tab.classList.add('active');
            document.getElementById(tab.dataset.target).classList.add('active');
            hideResults();
        });
    });

    elements.btnConvertPaste.addEventListener('click', processPastedText);
    
    elements.btnConvertManual.addEventListener('click', () => {
        const lat = parseFloat(elements.latManual.value);
        const lng = parseFloat(elements.lngManual.value);
        
        if (isNaN(lat) || isNaN(lng) || lat < -90 || lat > 90 || lng < -180 || lng > 180) {
            showError("Please enter valid decimal coordinates (Lat: -90 to 90, Lng: -180 to 180).");
            return;
        }
        showSuccess(lat, lng, "Manual Entry");
    });

    elements.btnOpenMaps.addEventListener('click', () => {
        if(currentMapsUrl) window.open(currentMapsUrl, '_blank');
    });

    elements.btnCopyLink.addEventListener('click', () => {
        if(currentMapsUrl) {
            navigator.clipboard.writeText(currentMapsUrl).then(() => {
                const originalText = elements.btnCopyLink.innerHTML;
                elements.btnCopyLink.innerHTML = "✅ Copied!";
                setTimeout(() => elements.btnCopyLink.innerHTML = originalText, 2000);
            });
        }
    });

    /**
     * UI Helpers
     */
    function toggleGroqInputs() {
        elements.groqInputs.style.display = elements.useGroqCheck.checked ? 'block' : 'none';
    }

    function showError(message) {
        elements.errorMsg.textContent = message;
        elements.errorMsg.style.display = 'block';
        elements.resultCard.style.display = 'none';
    }

    function hideResults() {
        elements.errorMsg.style.display = 'none';
        elements.resultCard.style.display = 'none';
    }

    function showLoading(show) {
        elements.loader.style.display = show ? 'block' : 'none';
        elements.btnConvertPaste.disabled = show;
    }

    function showSuccess(lat, lng, source) {
        elements.errorMsg.style.display = 'none';
        
        // Format to 6 decimal places for cleanliness
        const cleanLat = lat.toFixed(6);
        const cleanLng = lng.toFixed(6);
        
        elements.coordDisplay.textContent = `${cleanLat}, ${cleanLng}`;
        elements.resultSource.textContent = `Source: ${source}`;
        
        currentMapsUrl = `https://www.google.com/maps?q=${cleanLat},${cleanLng}`;
        elements.resultCard.style.display = 'block';
    }

    /**
     * Core Logic: Processing & Parsing
     */
    async function processPastedText() {
        const text = elements.gpsInput.value.trim();
        if (!text) {
            showError("Please paste some GPS data first.");
            return;
        }

        hideResults();
        showLoading(true);

        try {
            const useGroq = localStorage.getItem('useGroq') === 'true';
            const apiKey = localStorage.getItem('groqApiKey');
            
            let result = null;
            let source = "Standard Parser";

            if (useGroq && apiKey) {
                try {
                    result = await extractWithGroq(text, apiKey);
                    source = "Groq AI Extraction";
                } catch (e) {
                    console.warn("Groq failed, falling back to standard parser:", e);
                    // Fallback to standard regex parser
                    result = parseStandardRegex(text);
                    source = "Standard Parser (AI Fallback)";
                }
            } else {
                result = parseStandardRegex(text);
            }

            if (result && result.lat !== null && result.lng !== null) {
                showSuccess(result.lat, result.lng, source);
            } else {
                showError("Could not detect valid coordinates. Please check the format or try Manual Entry.");
            }

        } catch (err) {
            showError("An unexpected error occurred: " + err.message);
        } finally {
            showLoading(false);
        }
    }

    /**
     * Standard Regex Parser
     * Handles DMS (Degrees, Minutes, Seconds) and basic Decimal formats
     */
    function parseStandardRegex(text) {
        let lat = null;
        let lng = null;

        // 1. Check for pure decimal format: e.g., 44.911719, -93.166861
        const decimalRegex = /(-?\d{1,3}\.\d+)[^\d\.-]+(-?\d{1,3}\.\d+)/;
        const decMatch = text.match(decimalRegex);
        
        if (decMatch) {
            const v1 = parseFloat(decMatch[1]);
            const v2 = parseFloat(decMatch[2]);
            if (Math.abs(v1) <= 90 && Math.abs(v2) <= 180) {
                return { lat: v1, lng: v2 };
            }
        }

        // 2. Check for DMS format: e.g., 44 deg 54' 42.19" N
        // Captures: 1:Direction(prefix), 2:Deg, 3:Min, 4:Sec, 5:Direction(suffix)
        const dmsRegex = /([NSWE])?\s*(\d{1,3})\s*(?:deg|°|degrees)\s*(\d{1,2})['’]\s*(\d{1,2}(?:\.\d+)?)["”]\s*([NSWE])?/gi;
        const matches = [...text.matchAll(dmsRegex)];

        if (matches.length >= 2) {
            for(let i=0; i<2; i++) {
                const match = matches[i];
                // Direction could be at the start or end of the string
                const dir = (match[1] || match[5] || '').toUpperCase();
                const deg = parseFloat(match[2]);
                const min = parseFloat(match[3]);
                const sec = parseFloat(match[4]);
                
                let decimal = deg + (min / 60) + (sec / 3600);

                // South and West are negative
                if (dir === 'S' || dir === 'W') {
                    decimal = decimal * -1;
                }

                if (dir === 'N' || dir === 'S') lat = decimal;
                if (dir === 'E' || dir === 'W') lng = decimal;
            }
            
            // If the regex extracted both, return them
            if (lat !== null && lng !== null) {
                return { lat, lng };
            }
        }

        return null;
    }

    /**
     * Groq AI Extraction
     * Isolates API call logic. Expects strict JSON response.
     */
    async function extractWithGroq(text, apiKey) {
        const model = localStorage.getItem('groqModel') || 'llama3-8b-8192';
        
        const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${apiKey}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                model: model,
                messages: [
                    { 
                        role: "system", 
                        content: "You are an exact coordinate extraction tool. Extract the latitude and longitude from the provided text. Convert DMS to decimal if necessary. Respond ONLY with a JSON object containing exactly two keys: 'lat' and 'lng', mapping to their numeric decimal values. If you cannot find valid coordinates, return {\"lat\": null, \"lng\": null}." 
                    },
                    { 
                        role: "user", 
                        content: text 
                    }
                ],
                response_format: { type: "json_object" },
                temperature: 0.1 // Low temperature for factual extraction
            })
        });

        if (!response.ok) {
            throw new Error(`API Error: ${response.status}`);
        }

        const data = await response.json();
        const content = data.choices[0].message.content;
        
        const result = JSON.parse(content);
        
        if (result.lat === null || result.lng === null || isNaN(result.lat) || isNaN(result.lng)) {
            throw new Error("AI could not determine coordinates confidently.");
        }

        return {
            lat: parseFloat(result.lat),
            lng: parseFloat(result.lng)
        };
    }

    // Initialize the app on load
    init();

</script>
</body>
</html>
